name: Upstream parser audit

on:
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:
    inputs:
      report-master-drift:
        description: Also compare against the current Trino master branch
        required: false
        default: false
        type: boolean
      report-sqlglot-main-drift:
        description: Also compare against the current SQLGlot main branch
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  native-trino-483-oracle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install package
        run: pip install -e ".[dev]"
      - name: Build the dev-only Trino parser oracle
        run: >-
          mvn -q -f tools/trino_parser_oracle/pom.xml package
          dependency:build-classpath -Dmdep.outputFile=target/classpath.txt
      - name: Build complete offline corpus
        run: python tools/build_trino_oracle_corpus.py --output oracle-input.json
      - name: Compare labels with Trino 483
        run: >-
          python tools/run_trino_parser_oracle.py
          --oracle-dir tools/trino_parser_oracle
          --input oracle-input.json
          --output trino-483-oracle-report.json
      - name: Upload oracle report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: trino-483-parser-oracle
          path: trino-483-oracle-report.json

  pinned-trino-483:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: trinodb/trino
          ref: "483"
          path: .upstream/trino
          fetch-depth: 1
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install package and development dependencies
        run: pip install -e ".[dev]"
      - name: Check pinned Trino parser baseline
        run: >-
          python tools/audit_upstream_parsers.py
          --trino-root .upstream/trino
          --presto-ref 0.299
          --baseline plan/trino_483_audit_baseline.json
          --fail-on-regression
      - name: Check grammar inventory provenance
        run: >-
          python tools/build_trino_grammar_inventory.py
          --trino-root .upstream/trino
          --check

  trino-master-drift:
    if: github.event_name == 'workflow_dispatch' && inputs['report-master-drift']
    continue-on-error: true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install package and development dependencies
        run: pip install -e ".[dev]"
      - name: Report Trino master drift
        run: >-
          python tools/audit_upstream_parsers.py
          --trino-ref master
          --presto-ref 0.299

  pinned-sqlglot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install package and pinned SQLGlot audit dependencies
        run: pip install -e ".[dev,sqlglot-audit]"
      - name: Test SQLGlot audit helpers
        run: pytest tests/test_audit_sqlglot.py -q
      - name: Check pinned SQLGlot and Trino parser baseline
        run: >-
          python tools/audit_sqlglot.py
          --trino-ref 483
          --baseline plan/sqlglot_30_19_0_trino_483_audit_baseline.json
          --fail-on-regression

  sqlglot-main-drift:
    if: github.event_name == 'workflow_dispatch' && inputs['report-sqlglot-main-drift']
    continue-on-error: true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install package and SQLGlot main
        run: |
          pip install -e ".[dev]"
          pip install "sqlglot @ git+https://github.com/tobymao/sqlglot.git@main"
      - name: Report SQLGlot main drift
        run: >-
          python tools/audit_sqlglot.py
          --trino-ref 483
          --allow-version-mismatch
